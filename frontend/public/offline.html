<!doctype html>
<!-- Served by the service worker when a navigation fails offline, instead of
     the browser's "can't open the page" error. Self-contained on purpose:
     nothing else is cached, so it cannot reference other assets. Styles mirror
     the app's full-screen states (LoginScreen / LoadingScreen). -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#18191e" />
    <title>remote.futrx</title>
    <style>
      * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background: #090b0f;
        color: #e4e4e7;
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
      }
      .tile {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.5rem;
        background: rgba(138, 180, 255, 0.14);
        border: 1px solid rgba(138, 180, 255, 0.25);
        display: grid;
        place-items: center;
        color: #8ab4ff;
      }
      h1 { font-size: 1.25rem; font-weight: 600; line-height: 1.75rem; }
      p {
        font-size: 0.75rem;
        line-height: 1.625;
        color: #9b9ba3;
        margin-top: 0.375rem;
      }
      button {
        width: 100%;
        height: 2.75rem;
        border: 0;
        border-radius: 0.375rem;
        background: #8ab4ff;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      button:hover { background: rgba(138, 180, 255, 0.85); }
      button:disabled { opacity: 0.5; cursor: default; }
      .spinner { display: none; animation: spin 1s linear infinite; }
      button.retrying .spinner { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tile">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M12 20h.01" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 5.2-2.8" />
          <path d="M19 12.9a9.9 9.9 0 0 0-2.8-2" />
          <path d="M22 8.8a15 15 0 0 0-11.3-3.7" />
          <path d="M2 8.8a14.9 14.9 0 0 1 3.8-2.6" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <div>
        <h1>You&rsquo;re offline</h1>
        <p>remote.futrx needs a connection to reach your agents. It will reconnect on its own as soon as you&rsquo;re back online.</p>
      </div>
      <button id="retry" type="button">
        <svg class="spinner" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
        </svg>
        Try again
      </button>
    </div>
    <script>
      var retry = document.getElementById("retry");
      function reload() {
        retry.classList.add("retrying");
        retry.disabled = true;
        location.reload();
      }
      retry.addEventListener("click", reload);
      window.addEventListener("online", reload);
    </script>
  </body>
</html>

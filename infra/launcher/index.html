<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Futrx IDE</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0b0d11" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #0b0d11; color: #e6e9ef;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; padding: max(24px, env(safe-area-inset-top)) 20px 40px;
  }
  header { max-width: 920px; margin: 0 auto 22px; display: flex; align-items: center; gap: 12px; }
  header img { width: 34px; height: 34px; }
  header h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  header p { margin: 2px 0 0; color: #8b93a3; font-size: 12.5px; }
  main { max-width: 920px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    appearance: none; text-align: left; cursor: pointer; color: inherit;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 14px 14px 13px; display: flex; flex-direction: column; gap: 7px;
    transition: background .12s, border-color .12s, transform .04s;
  }
  .card:hover { background: rgba(255,255,255,.08); border-color: rgba(77,159,255,.5); }
  .card:active { transform: translateY(1px); }
  .card .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .slug { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6f7888; }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ec27a; flex: none; }
  .dot.off { background: #5b6472; }
  .status { color: #8b93a3; padding: 8px 2px; }
  .status.err { color: #ff6b6b; }
</style>
</head>
<body>
  <header>
    <img src="/icon.svg" alt="" />
    <div>
      <h1>Futrx IDE</h1>
      <p>Open a project where Code Server is installed</p>
    </div>
  </header>
  <main>
    <div id="status" class="status">Loading projects…</div>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    const ideUrl = (slug) => `/${slug}/?folder=/workspace`;
    async function load() {
      const status = document.getElementById("status");
      try {
        const [projectRes, extensionRes] = await Promise.all([
          fetch("/api/projects", { credentials: "include" }),
          fetch("/api/applications/ui", { credentials: "include" }),
        ]);
        if (!projectRes.ok || !extensionRes.ok) throw new Error("Could not load installed projects");
        const projects = await projectRes.json();
        const extensions = await extensionRes.json();
        const codeServer = Array.isArray(extensions)
          ? extensions.find((item) => item.application?.id === "code-server") : null;
        const installed = new Set(codeServer?.projectIds || []);
        const count = render(Array.isArray(projects)
          ? projects.filter((project) => installed.has(project.id)) : []);
        if (count) status.style.display = "none";
      } catch (e) {
        status.className = "status err";
        status.textContent = "Could not load projects: " + e.message;
      }
    }
    function render(projects) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      projects
        .filter((p) => p.slug || p.containerName)
        .sort((a, b) => (a.name || a.slug || "").localeCompare(b.name || b.slug || ""))
        .forEach((p) => {
          const slug = p.slug || p.containerName;
          const running = (p.status && (p.status.containerState || p.status.state)) === "RUNNING";
          const card = document.createElement("button");
          card.className = "card";
          card.title = "Open " + slug + " IDE in a new window";
          card.innerHTML =
            '<div class="row"><span class="dot' + (running ? "" : " off") +
            '"></span><span class="name"></span></div><span class="slug"></span>';
          card.querySelector(".name").textContent = p.name || slug;
          card.querySelector(".slug").textContent = slug + ".code";
          card.addEventListener("click", () => window.open(ideUrl(slug), "_blank", "noopener"));
          grid.appendChild(card);
        });
      if (!grid.children.length) {
        const s = document.getElementById("status");
        s.style.display = ""; s.textContent = "Install Code Server in a project to open its IDE here.";
      }
      return grid.children.length;
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    load();
  </script>
</body>
</html>

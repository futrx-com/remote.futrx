# Push to main → fast-path code deploy.
#
# Pulls latest, rebuilds frontend + backend, restarts the backend service,
# health-checks it. Takes ~25s. Does NOT touch Caddy, host packages,
# code-server, systemd unit, or LXD. For those, run
# `sudo bash infra/update.sh` on the box (or apply a release tag from the
# in-app updater) — both re-detect the box's hostname from the installed
# unit, so they never change the domain a box serves.
#
# Secrets required:
#   SSH_KEY      private OpenSSH key authorized on $DEPLOY_HOST as $DEPLOY_USER
#   KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#   DEPLOY_HOST  hostname or IP for SSH connectivity (can be a raw IP)
#   DEPLOY_USER  ssh user (root for our setup)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test installer compatibility
        run: |
          bash infra/tests/go-toolchain-test.sh
          bash infra/tests/go-download-check.sh
          bash infra/tests/agent-cli-versions-test.sh
          bash infra/tests/install-migration-test.sh
          bash infra/tests/health-check-test.sh
          bash infra/tests/dns-resolve-test.sh
          bash infra/tests/container-forwarding-test.sh
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend test

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "Deploying ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) → ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo

          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "bash -se" <<'REMOTE'
          set -euo pipefail

          # The first deploy after the project rename needs the full updater:
          # it moves the checkout/data and swaps systemd units with rollback.
          if [ ! -d /opt/remote.futrx/.git ] && [ -d /opt/remote.futrx.dev/.git ]; then
              cd /opt/remote.futrx.dev
              echo "==> updating legacy checkout before one-time migration"
              git fetch --quiet --tags origin
              git reset --hard origin/main
              bash infra/update.sh --skip-workspaces
              exit 0
          fi

          cd /opt/remote.futrx

          echo "==> git fetch + fast-forward to origin/main"
          git fetch --quiet --tags origin
          git reset --hard origin/main

          echo "==> frontend build"
          ( cd frontend && npm install --silent --no-audit --no-fund 2>&1 | tail -3 && npm run build 2>&1 | tail -5 )

          echo "==> backend build"
          ( cd backend && go build -trimpath \
              -ldflags="-s -w -X github.com/futrx-com/remote.futrx.com/internal/version.Version=$(git describe --tags --always --dirty)" \
              -o remote ./cmd/remote )

          echo "==> restart backend"
          systemctl restart remote.futrx
          systemctl is-active --quiet remote.futrx || {
              echo "✗ service failed to start"
              journalctl -u remote.futrx -n 30 --no-pager
              exit 1
          }

          # Cold start binds the port only after converging container resource
          # envelopes (~13s with 16 projects), so allow a real 30s deadline.
          echo "==> health check"
          . infra/lib/health-check.sh
          if wait_for_http_health http://127.0.0.1:7682/ 30; then
              echo "✓ backend responding"
          else
              echo "✗ backend did not respond on 127.0.0.1:7682 within 30s"
              journalctl -u remote.futrx -n 30 --no-pager
              exit 1
          fi
          REMOTE

      - name: Summary
        if: success()
        run: echo "::notice ::Deployed ${GITHUB_SHA::7}"

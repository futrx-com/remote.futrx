name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check Go test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: backend/.testcoverage.yml

      - name: Build backend binaries
        run: go build -v ./...

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: node --experimental-strip-types --test --experimental-test-coverage

      - name: Typecheck and build
        run: npm run build

  scripts:
    name: Scripts & Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run release classifier tests
        run: bash .github/scripts/classify-release-test.sh

      - name: Run release version tests
        run: bash infra/tests/release-version-test.sh

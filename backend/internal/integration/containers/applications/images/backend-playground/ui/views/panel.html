<section class="bp-panel">
  <header class="bp-head">
    <img data-field="logo" alt="" class="bp-logo" />
    <div class="bp-title">
      <strong>Backend Playground</strong>
      <span class="bp-sub">A Go plugin compiled from this image and run on the server.</span>
    </div>
    <span class="bp-status" data-field="status" data-ok="false">checking…</span>
  </header>

  <p class="bp-detail-line" data-field="detail"></p>

  <ul class="bp-routes" data-field="routes">
    <li class="bp-empty">loading the plugin's route table…</li>
  </ul>

  <div class="bp-actions">
    <button type="button" class="bp-call bp-primary" data-action="console">
      Open plugin console
    </button>
    <button type="button" class="bp-call" data-action="selftest">
      Run backend self-test
    </button>
  </div>
</section>

<!--
  Popup body used for both the slot-context inspector and the self-test report.
  main.js decides which section to fill and hides the other.
-->
<div class="pg-popup">
  <section data-section="context" hidden>
    <p class="pg-lead">The context this slot passed to the click handler:</p>
    <pre class="pg-code" data-field="context">…</pre>
  </section>

  <section data-section="selftest" hidden>
    <p class="pg-lead">Extension API self-test:</p>
    <ul class="pg-results" data-field="results"></ul>
    <p class="pg-summary" data-field="summary"></p>
  </section>
</div>

<!--
  Panel rendered under the applications list. Loaded by scripts/main.js through
  remote.views.load("index"); placeholders in {{braces}} are filled there.
-->
<section class="mysql-ext-panel">
  <h4 class="mysql-ext-panel__title">Connecting to MySQL</h4>
  <p class="mysql-ext-panel__lead">
    {{count}} installed. Inside a project container, reach it on the LXD bridge;
    from the host, use the mapped port shown on the card.
  </p>
  <pre class="mysql-ext-code"><code>mysql -h {{host}} -P {{port}} -u root -p</code></pre>
</section>

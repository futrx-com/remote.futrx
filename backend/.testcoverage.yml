# Configuration for vladopajic/go-test-coverage
# https://github.com/vladopajic/go-test-coverage

# Path to the coverage profile generated by 'go test -coverprofile'
profile: coverage.out

# Local prefix used to trim module path from package names in reports
local-prefix: github.com/futrx-com/remote.futrx.com

# Coverage thresholds (percentages)
threshold:
  # Minimum total statement coverage across all packages (baseline is ~48%)
  total: 45

  # Minimum coverage per package (can be increased as packages gain tests)
  package: 0

  # Minimum coverage per file
  file: 0
